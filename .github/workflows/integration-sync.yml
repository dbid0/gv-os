name: integration-sync

# ONE scheduled workflow that both warms the app and pulls every connected
# integration — deliberately merged. GitHub bills a private repo's Actions by
# the run, ROUNDED UP to the minute, so two separate schedules (a warm ping +
# a sync) cost two billed minutes for ~25 seconds of work. Folding them into a
# single job pays one minute and warms the dashboard path as a side effect of
# the sync it was already doing.
#
# Cadence is 30 minutes. Payments and new leads arrive in real time over their
# own webhooks (Stripe, new-deals) — this poll is the backstop for everything
# else (Close, Calendly, Typeform, Kit, Fathom), where 30 minutes is plenty.
# At */30 this workflow costs ~1,440 billed minutes/month; the retired */5
# keep-warm alone was ~8,640.
#
# Setup (one time): add a repo secret `SYNC_SECRET` matching the app's
# SYNC_SECRET env. Until it's set, this workflow skips cleanly instead of erroring.
#
# continue-on-error: a scheduler is not a monitor — a flaky run must never email
# the repo owner. Sync health is surfaced in-app (the connection cards + the
# morning brief), not here.

on:
  schedule:
    - cron: "*/30 * * * *"
    # The 11:00 UTC firing also refreshes the tracking mirrors (sheet +
    # processor snapshots) — once a day, before the workday, deliberate.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - name: Warm the function + DB pool + signed-in path
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          # /api/health = process + DB socket; /dashboard = the middleware
          # function (a 307 off the login wall). /api/warm runs the dashboard's
          # own queries + caches + JWKS under the bearer secret — the actual
          # path a signed-in visitor takes.
          for path in /api/health /dashboard; do
            code=$(curl -s -o /dev/null -m 40 --retry 2 --retry-delay 6 --retry-all-errors \
              -w "%{http_code} %{time_total}s" "https://os.globalventures.app$path" || echo "ERR")
            echo "$path -> $code"
          done
          if [ -n "$SYNC_SECRET" ]; then
            curl -s -m 40 --retry 2 --retry-delay 6 --retry-all-errors \
              -H "Authorization: Bearer $SYNC_SECRET" \
              "https://os.globalventures.app/api/warm" || true
            echo ""
          fi

      - name: Pull all connected integrations
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$SYNC_SECRET" ]; then
            echo "SYNC_SECRET repo secret not set — skipping (add it to enable auto-sync)."
            exit 0
          fi
          code=$(curl -s -o /tmp/pull.json -m 300 --retry 2 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -w "%{http_code}" "https://os.globalventures.app/api/sync/all-pulls" || echo "ERR")
          echo "all-pulls -> $code"
          head -c 1000 /tmp/pull.json 2>/dev/null || true

      - name: Daily tracking snapshot (sheet + processor mirrors)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 11')
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$SYNC_SECRET" ]; then exit 0; fi
          code=$(curl -s -o /tmp/track.json -m 300 --retry 2 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -w "%{http_code}" "https://os.globalventures.app/api/sync/tracking?transcripts=1" || echo "ERR")
          echo "tracking -> $code"
          head -c 1000 /tmp/track.json 2>/dev/null || true
