name: daily-pulls

# Runs every integration pull once a day from GitHub's cloud — Close rep
# activity, Kit snapshots, Stripe payment events. Each endpoint is
# idempotent, so a re-run (or the manual dispatch) can never double-capture.
# 10:30 UTC = 5:30am CT, before the 6am drift check, so the morning numbers
# are fresh. A failed run is the alert.

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch: {}

jobs:
  pulls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull Close, Kit, Stripe
        run: |
          fail=0
          for path in close kit payments bookings; do
            out=$(curl -s -m 120 --retry 2 --retry-delay 10 -X POST \
              -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
              "https://os.globalventures.app/api/sync/$path")
            echo "$path: $out"
            ok=$(echo "$out" | python3 -c "import json,sys; print(json.load(sys.stdin).get('ok'))" 2>/dev/null || echo "parse-error")
            if [ "$ok" != "True" ]; then
              echo "::error::$path pull FAILED: $out"
              fail=1
            fi
          done
          exit $fail
