name: db-backup

# Nightly backup of the money ledger, ENCRYPTED, with a REHEARSED restore in the
# same run. A dump nobody has ever restored is a rumour, not a backup, so every
# run restores the dump into a throwaway Postgres and asserts the core money
# tables came back with rows before anything is kept.
#
# ⛔ The repo is PUBLIC: anyone signed in to GitHub can download Actions
# artifacts. So the plaintext dump never leaves the runner. It is encrypted
# with AES-256 (gpg symmetric) using BACKUP_ENCRYPTION_PASSPHRASE, and only the
# .gpg file is uploaded. Without the passphrase the artifact is noise. The
# passphrase is kept off GitHub as well, in the owner's credentials folder.
#
# Scope: the `app` and `ledger` schemas (where the ledger lives: app.clients,
# app.transactions, ledger.*). Supabase-managed schemas reference roles and
# extensions a vanilla postgres:17 doesn't have, so a full-database dump would
# fail to restore here for reasons unrelated to whether the money data is safe.
#
# Targets:
#   schedule (nightly)      → production (BACKUP_DATABASE_URL, falling back to
#                              PROD_MIGRATION_DATABASE_URL)
#   manual, target=staging  → staging (STAGING_MIGRATION_DATABASE_URL), to
#                              rehearse the pipeline without touching production
#   manual, target=production
# Every required secret is checked first; a missing one fails loudly. A backup
# job that quietly no-ops is the one failure mode it exists to prevent.
#
# Restore (anywhere with gpg + pg_restore):
#   gpg --batch --decrypt --passphrase "$PASS" gvos-backup-<stamp>.dump.gpg > backup.dump
#   pg_restore --dbname="$TARGET_URL" --no-owner --no-privileges backup.dump

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which database to back up"
        required: true
        default: production
        type: choice
        options: [production, staging]

permissions:
  contents: read

jobs:
  backup:
    name: dump app+ledger · restore-check · encrypt · upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A failed backup must surface. Do not add continue-on-error.
    continue-on-error: false

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Select source and check secrets
        env:
          TARGET: ${{ inputs.target || 'production' }}
          BACKUP_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PROD_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
          STAGING_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE is not set. The repo is public, so an unencrypted dump will never be uploaded. Nothing was backed up."
            exit 1
          fi
          if [ "$TARGET" = "staging" ]; then
            URL="$STAGING_URL"; NAME=STAGING_MIGRATION_DATABASE_URL
          else
            URL="${BACKUP_URL:-$PROD_URL}"; NAME="BACKUP_DATABASE_URL (or PROD_MIGRATION_DATABASE_URL)"
          fi
          if [ -z "$URL" ]; then
            echo "::error::$NAME is not set: a SESSION POOLER connection string (port 5432) for the $TARGET database. Nightly backups cannot run until it is. Nothing was backed up."
            exit 1
          fi
          echo "::add-mask::$URL"
          echo "SOURCE_URL=$URL" >> "$GITHUB_ENV"
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "FILE=gvos-backup-$TARGET-$STAMP.dump" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Install postgresql-client-17 (matches the Supabase server version)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # The runner ships Postgres 16 tools whose wrapper wins on PATH, and
          # pg_dump refuses a newer server (Supabase runs 17). Put 17 first.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump app + ledger schemas
        run: |
          set -euo pipefail
          pg_dump "$SOURCE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --schema=app \
            --schema=ledger \
            --file="$FILE"
          # Size only — never contents.
          ls -lh "$FILE"

      - name: Restore into throwaway Postgres and verify
        run: |
          set -euo pipefail
          RESTORE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          pg_restore --dbname="$RESTORE_URL" --no-owner --no-privileges "$FILE"
          CLIENTS_COUNT=$(psql "$RESTORE_URL" -tAc "SELECT count(*) FROM app.clients")
          TX_COUNT=$(psql "$RESTORE_URL" -tAc "SELECT count(*) FROM app.transactions")
          # Counts only, never rows.
          echo "restored app.clients rows: $CLIENTS_COUNT"
          echo "restored app.transactions rows: $TX_COUNT"
          if [ "$CLIENTS_COUNT" -le 0 ] || [ "$TX_COUNT" -le 0 ]; then
            echo "::error::Restore check failed: app.clients or app.transactions restored with zero rows. The source URL points at the wrong database, or it is empty. Nothing was uploaded."
            exit 1
          fi

      - name: Encrypt, then destroy the plaintext
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$PASSPHRASE" --output "$FILE.gpg" "$FILE"
          shred -u "$FILE"
          # The encrypted file must decrypt back to a valid dump before it is kept.
          gpg --batch --pinentry-mode loopback --passphrase "$PASSPHRASE" --decrypt "$FILE.gpg" \
            | pg_restore --list > /dev/null
          ls -lh "$FILE.gpg"
          echo "encrypted and verified decryptable"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: gvos-db-backup-${{ env.TARGET }}-${{ env.STAMP }}
          path: ${{ env.FILE }}.gpg
          retention-days: 21
          if-no-files-found: error
