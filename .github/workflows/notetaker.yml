name: notetaker

# The GV notetaker, in the cloud. Triggered on demand by the Discord /join
# command (never on a schedule) — the bot joins whatever call people are in,
# records per speaker, then transcribes with faster-whisper, distills with
# Claude Code, and POSTs the recap + action items into GV OS (Team -> Meetings,
# and the tasks land on the Work board). Runs entirely in GitHub's cloud.
#
# Two steps on purpose: RECORD keeps only the Node deps so the bot joins the
# call in seconds; the slow whisper/claude install waits until PROCESS, after
# the call has already ended.
#
# Triggers:
#   - repository_dispatch (notetaker-join): the /join slash command, via the
#     app's /api/discord/interactions endpoint.
#   - workflow_dispatch: run it by hand (join whoever is in the team call now).
#
# Setup (one time) — repo secrets: DISCORD_BOT_TOKEN, CLAUDE_CODE_OAUTH_TOKEN,
# SYNC_SECRET. Until DISCORD_BOT_TOKEN is set, the job skips cleanly.

on:
  repository_dispatch:
    types: [notetaker-join]
  workflow_dispatch:
    inputs:
      caller_id:
        description: "User id whose call to join (blank = busiest voice channel)"
        required: false
      title:
        description: "Meeting title"
        required: false
        default: "Team call"
      client_slug:
        description: "Scope to one client (slug), optional"
        required: false

concurrency:
  group: notetaker
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    # Recording can run up to MAX_MINUTES (120), then transcription runs after.
    # 150 was too tight — a ~87-min call + slow transcription hit the cap and got
    # cancelled mid-transcript. 330 leaves ample headroom (GitHub's max is 360).
    timeout-minutes: 330
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Skip if the bot token isn't set yet
        id: guard
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "DISCORD_BOT_TOKEN not set — skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # No setup-node: use the runner's pre-installed Node 20 — saves ~9s off
      # the join. Cache node_modules keyed on the lockfile so after the first run
      # deps restore in ~1s instead of a fresh npm install.
      - name: Cache recorder deps
        if: steps.guard.outputs.go == 'true'
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: notetaker/node_modules
          key: notetaker-npm-${{ runner.os }}-${{ hashFiles('notetaker/package-lock.json') }}

      - name: Install recorder deps
        if: steps.guard.outputs.go == 'true' && steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: notetaker
        run: npm install --no-audit --no-fund

      - name: Join the call + record
        id: rec
        if: steps.guard.outputs.go == 'true'
        working-directory: notetaker
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ github.event.client_payload.guild_id || vars.GV_GUILD_ID || '1535873854570889257' }}
          CALLER_ID: ${{ github.event.client_payload.caller_id || github.event.inputs.caller_id || '' }}
          VOICE_CHANNEL_ID: ${{ github.event.client_payload.voice_channel_id || '' }}
          # Narrate in 🧠・operating.
          STATUS_CHANNEL_ID: ${{ vars.GV_OPERATING_CHANNEL_ID || '1536050920121569380' }}
          JOIN_WAIT_MINUTES: "15"
          MAX_MINUTES: "120"
        run: node recorder.js

      # FAILSAFE: compress each speaker's raw PCM to a small opus BEFORE the slow
      # transcription. Runs even if later steps fail/time out, so the recording is
      # always captured in the uploaded artifact and a lost call can be re-processed.
      - name: Preserve the recording (compress audio)
        if: always() && steps.guard.outputs.go == 'true' && steps.rec.outputs.session_dir != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for pcm in "${{ steps.rec.outputs.session_dir }}"/u_*.pcm; do
            [ -e "$pcm" ] || continue
            ffmpeg -y -v quiet -f s16le -ar 48000 -ac 2 -i "$pcm" \
              -ac 1 -ar 16000 -c:a libopus -b:a 24k "${pcm%.pcm}.opus" || true
          done
          echo "compressed audio kept for the artifact"

      - name: Set up Python
        if: steps.guard.outputs.go == 'true' && steps.rec.outputs.session_dir != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install transcription + Claude Code
        if: steps.guard.outputs.go == 'true' && steps.rec.outputs.session_dir != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet faster-whisper
          npm install -g @anthropic-ai/claude-code

      - name: Transcribe + distill + post to GV OS
        if: steps.guard.outputs.go == 'true' && steps.rec.outputs.session_dir != ''
        working-directory: notetaker
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          GV_OS_URL: https://os.globalventures.app
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Post the finished summary + tasks in ✅・tasks.
          TASKS_CHANNEL_ID: ${{ vars.GV_TASKS_CHANNEL_ID || '1536050931668361348' }}
          MEETING_TITLE: ${{ github.event.client_payload.title || github.event.inputs.title || 'Team call' }}
          MEETING_SOURCE: ${{ github.event.client_payload.source || 'agency_call' }}
          CLIENT_SLUG: ${{ github.event.client_payload.client_slug || github.event.inputs.client_slug || '' }}
        run: python3 process_call.py "${{ steps.rec.outputs.session_dir }}"

      # FAILSAFE: keep the recording (compressed audio) + transcript + distilled
      # result for 14 days, on EVERY run. If posting ever fails, nothing is lost —
      # the transcript can be re-posted or the audio re-transcribed from here.
      - name: Upload recording + transcript (failsafe)
        if: always() && steps.guard.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-recording
          path: |
            notetaker/sessions/**/manifest.json
            notetaker/sessions/**/transcript.txt
            notetaker/sessions/**/result.json
            notetaker/sessions/**/*.opus
          if-no-files-found: ignore
          retention-days: 14

      # FAILSAFE: if the run failed or timed out, TELL Daniel in #operating right
      # away (with the run link) instead of it failing silently. The recording is
      # already safe in the artifact above.
      - name: Alert on failure
        if: (failure() || cancelled()) && steps.guard.outputs.go == 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          OPERATING: ${{ vars.GV_OPERATING_CHANNEL_ID || '1536050920121569380' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -o /dev/null -X POST \
            "https://discord.com/api/v10/channels/$OPERATING/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **Notetaker run failed or timed out** — notes were NOT posted, but the recording + transcript are saved as a downloadable artifact for 14 days (re-processable). Run: $RUN_URL\"}" \
            || true
