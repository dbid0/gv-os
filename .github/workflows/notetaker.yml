name: notetaker

# The GV notetaker, in the cloud. Triggered on demand by the Discord /join
# command (never on a schedule) — the bot joins whatever call people are in,
# records per speaker, then transcribes with faster-whisper, distills with
# Claude Code, and POSTs the recap + action items into GV OS (Team -> Meetings,
# and the tasks land on the Work board). Runs entirely in GitHub's cloud.
#
# Two steps on purpose: RECORD keeps only the Node deps so the bot joins the
# call in seconds; the slow whisper/claude install waits until PROCESS, after
# the call has already ended.
#
# Triggers:
#   - repository_dispatch (notetaker-join): the /join slash command, via the
#     app's /api/discord/interactions endpoint.
#   - workflow_dispatch: run it by hand (join whoever is in the team call now).
#
# Setup (one time) — repo secrets: DISCORD_BOT_TOKEN, CLAUDE_CODE_OAUTH_TOKEN,
# SYNC_SECRET. Until DISCORD_BOT_TOKEN is set, the job skips cleanly.

on:
  repository_dispatch:
    types: [notetaker-join]
  workflow_dispatch:
    inputs:
      caller_id:
        description: "User id whose call to join (blank = busiest voice channel)"
        required: false
      title:
        description: "Meeting title"
        required: false
        default: "Team call"
      client_slug:
        description: "Scope to one client (slug), optional"
        required: false

concurrency:
  group: notetaker
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Skip if the bot token isn't set yet
        id: guard
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "DISCORD_BOT_TOKEN not set — skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.guard.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install recorder deps (fast — so the bot joins quickly)
        if: steps.guard.outputs.go == 'true'
        working-directory: notetaker
        run: npm install --no-audit --no-fund

      - name: Join the call + record
        id: rec
        if: steps.guard.outputs.go == 'true'
        working-directory: notetaker
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ github.event.client_payload.guild_id || vars.GV_GUILD_ID || '1535873854570889257' }}
          CALLER_ID: ${{ github.event.client_payload.caller_id || github.event.inputs.caller_id || '' }}
          VOICE_CHANNEL_ID: ${{ github.event.client_payload.voice_channel_id || '' }}
          JOIN_WAIT_MINUTES: "15"
          MAX_MINUTES: "120"
        run: node recorder.js

      - name: Set up Python
        if: steps.guard.outputs.go == 'true' && steps.rec.outputs.session_dir != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install transcription + Claude Code
        if: steps.guard.outputs.go == 'true' && steps.rec.outputs.session_dir != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet faster-whisper
          npm install -g @anthropic-ai/claude-code

      - name: Transcribe + distill + post to GV OS
        if: steps.guard.outputs.go == 'true' && steps.rec.outputs.session_dir != ''
        working-directory: notetaker
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          GV_OS_URL: https://os.globalventures.app
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TASKS_CHANNEL_ID: ${{ vars.GV_TASKS_CHANNEL_ID || '' }}
          MEETING_TITLE: ${{ github.event.client_payload.title || github.event.inputs.title || 'Team call' }}
          MEETING_SOURCE: ${{ github.event.client_payload.source || 'agency_call' }}
          CLIENT_SLUG: ${{ github.event.client_payload.client_slug || github.event.inputs.client_slug || '' }}
        run: python3 process_call.py "${{ steps.rec.outputs.session_dir }}"

      - name: Upload run log
        if: always() && steps.guard.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notetaker-log
          path: notetaker/sessions/**/manifest.json
          if-no-files-found: ignore
          retention-days: 3
